name: Build APK

on:
  push:
    branches: [ main, "claude/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle (caches deps, uses the repo's committed wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coloros-launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Publishes/updates a single "debug-latest" release so the download link never changes
      # between builds — no GitHub login needed to fetch it, unlike the workflow artifact above.
      - name: Publish debug APK to the "debug-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "ColorOS Launcher — latest debug build"
          body: |
            Auto-published from the latest successful build on `${{ github.ref_name }}`
            (commit ${{ github.sha }}). This release is overwritten on every successful run.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
